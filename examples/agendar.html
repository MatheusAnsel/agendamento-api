<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agendar horário</title>
<style>
  :root { --bg:#f6f4f1; --card:#fff; --ink:#1f2328; --muted:#6b7280; --line:#e5e1db;
          --accent:#7c3aed; --accent-ink:#fff; --ok:#15803d; --err:#b91c1c; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  section { background: var(--card); border:1px solid var(--line); border-radius: 12px;
            padding: 16px; margin-bottom: 16px; }
  section.off { opacity:.45; pointer-events:none; }
  h2 { font-size: .8rem; letter-spacing:.06em; text-transform: uppercase; color: var(--muted);
       margin: 0 0 12px; }
  .grid { display:flex; flex-wrap:wrap; gap:8px; }
  button.chip, label.chip { border:1px solid var(--line); background:#fff; border-radius:10px;
       padding:10px 14px; cursor:pointer; font:inherit; color:inherit; text-align:left; }
  button.chip:hover { border-color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip small { display:block; opacity:.75; }
  .service { width:100%; display:flex; justify-content:space-between; gap:12px; }
  .field { margin-bottom: 12px; }
  .field label { display:block; font-size:.9rem; margin-bottom:4px; }
  input, select, textarea { width:100%; padding:10px 12px; border:1px solid var(--line);
       border-radius:8px; font:inherit; background:#fff; }
  .hp { position:absolute; left:-9999px; height:0; overflow:hidden; }
  .primary { width:100%; background:var(--accent); color:var(--accent-ink); border:0;
       border-radius:10px; padding:14px; font:inherit; font-weight:600; cursor:pointer; }
  .primary:disabled { opacity:.5; cursor:not-allowed; }
  .msg { padding:10px 12px; border-radius:8px; margin-top:12px; font-size:.95rem; }
  .msg.err { background:#fee2e2; color:var(--err); }
  .done h2 { color: var(--ok); }
  .done dl { margin:0; display:grid; grid-template-columns: 110px 1fr; gap:6px 12px; }
  .done dt { color: var(--muted); } .done dd { margin:0; font-weight:600; }
  .link { background:none; border:0; color:var(--err); cursor:pointer; padding:0; font:inherit;
          text-decoration: underline; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Agendar horário</h1>
  <p class="sub" id="subtitle">Escolha o serviço, o dia e o horário.</p>

  <section id="s-service"><h2>1. Serviço</h2><div id="services" class="grid"></div></section>
  <section id="s-resource" class="off"><h2>2. Profissional</h2><div id="resources" class="grid"></div></section>
  <section id="s-day" class="off"><h2>3. Dia</h2><div id="days" class="grid"></div></section>
  <section id="s-time" class="off"><h2>4. Horário</h2><div id="times" class="grid"></div></section>
  <section id="s-form" class="off">
    <h2>5. Seus dados</h2>
    <form id="form" novalidate>
      <div id="fields"></div>
      <div class="hp" aria-hidden="true"><input id="website" tabindex="-1" autocomplete="off"></div>
      <button class="primary" id="submit" type="submit">Confirmar agendamento</button>
      <div id="error" class="msg err" hidden></div>
    </form>
  </section>
  <section id="s-done" class="done" hidden></section>
</main>

<script>
// Para usar em outro site, troque estes dois valores. A chave e publica por design:
// quem protege e a lista de sites permitidos cadastrada no negocio.
const params = new URLSearchParams(location.search);
const API_URL = params.get("api") || "http://localhost:8000";
const API_KEY = params.get("key") || "COLE_AQUI_A_CHAVE_DO_SITE";

const state = { service:null, resource:null, day:null, slot:null, config:null, services:[], resources:[] };
const $ = (id) => document.getElementById(id);
const brl = (c) => c == null ? "" : (c / 100).toLocaleString("pt-BR", {style:"currency", currency:"BRL"});

async function api(path, options = {}) {
  const response = await fetch(API_URL + path, {
    ...options,
    headers: { "X-API-Key": API_KEY, "Content-Type": "application/json", ...(options.headers || {}) },
  });
  const body = response.status === 204 ? null : await response.json().catch(() => null);
  if (!response.ok) {
    const detail = body && body.detail;
    throw new Error(typeof detail === "string" ? detail : "Não foi possível concluir. Tente de novo.");
  }
  return body;
}

function enable(id, on) { $(id).classList.toggle("off", !on); }
function mark(container, el) { container.querySelectorAll(".chip").forEach(c => c.classList.remove("on")); el.classList.add("on"); }
function chip(text, small, onClick) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip";
  b.innerHTML = `${text}${small ? `<small>${small}</small>` : ""}`;
  b.onclick = () => onClick(b);
  return b;
}

async function init() {
  state.config = await api("/v1/config");
  state.services = await api("/v1/services");
  state.resources = await api("/v1/resources");
  $("title").textContent = state.config.name;
  document.title = "Agendar - " + state.config.name;
  for (const s of state.services) {
    const b = chip(`<span class="service"><span>${s.name}</span><span>${brl(s.price_cents)}</span></span>`,
                   `${s.duration_minutes} min`, (el) => pickService(s, el));
    b.style.width = "100%";
    $("services").appendChild(b);
  }
  buildForm();
}

async function pickService(service, el) {
  mark($("services"), el);
  Object.assign(state, { service, resource:null, day:null, slot:null });
  const box = $("resources"); box.innerHTML = "";
  const people = state.resources.filter(r => service.resource_ids.includes(r.id));
  box.appendChild(chip("Qualquer profissional", "", (e) => { mark(box, e); state.resource = null; loadDays(); }));
  box.firstChild.classList.add("on");
  if (people.length > 1) for (const r of people) box.appendChild(chip(r.name, "", (e) => { mark(box, e); state.resource = r.id; loadDays(); }));
  enable("s-resource", people.length > 1);
  enable("s-time", false); enable("s-form", false);
  await loadDays();
}

async function loadDays() {
  state.day = null; state.slot = null;
  const today = new Date();
  const to = new Date(today.getTime() + 30 * 864e5);
  const iso = (d) => d.toISOString().slice(0, 10);
  const q = new URLSearchParams({ service_id: state.service.id, from: iso(today), to: iso(to) });
  if (state.resource) q.set("resource_id", state.resource);
  const { days } = await api("/v1/availability?" + q);
  const box = $("days"); box.innerHTML = "";
  if (!days.length) box.textContent = "Sem dias disponíveis nos próximos 30 dias.";
  for (const d of days) {
    const date = new Date(d + "T12:00:00");
    const label = date.toLocaleDateString("pt-BR", { weekday:"short", day:"2-digit", month:"short" });
    box.appendChild(chip(label, "", (el) => { mark(box, el); pickDay(d); }));
  }
  enable("s-day", true); enable("s-time", false); enable("s-form", false);
}

async function pickDay(day) {
  state.day = day; state.slot = null;
  const q = new URLSearchParams({ service_id: state.service.id, date: day });
  if (state.resource) q.set("resource_id", state.resource);
  const { slots } = await api("/v1/slots?" + q);
  const box = $("times"); box.innerHTML = "";
  for (const s of slots) {
    box.appendChild(chip(s.start.slice(11, 16), "", (el) => { mark(box, el); state.slot = s; enable("s-form", true); }));
  }
  enable("s-time", true); enable("s-form", false);
}

function buildForm() {
  const cfg = state.config.form_config;
  const required = new Set([...cfg.required_fields, "name", "phone"]);
  const rows = [];
  const add = (key, label, type, isRequired, extra = "") =>
    rows.push(`<div class="field"><label for="f-${key}">${label}${isRequired ? " *" : ""}</label>${extra || `<input id="f-${key}" data-key="${key}" type="${type}" ${isRequired ? "required" : ""}>`}</div>`);
  add("name", "Nome", "text", true);
  add("phone", "Telefone (WhatsApp)", "tel", true);
  if (required.has("email") || cfg.optional_fields.includes("email")) add("email", "E-mail", "email", required.has("email"));
  for (const f of cfg.custom_fields) {
    if (f.type === "select") add(f.key, f.label, "text", f.required,
      `<select id="f-${f.key}" data-custom="${f.key}">${f.options.map(o => `<option>${o}</option>`).join("")}</select>`);
    else rows.push(`<div class="field"><label for="f-${f.key}">${f.label}${f.required ? " *" : ""}</label><input id="f-${f.key}" data-custom="${f.key}" type="${f.type === "number" ? "number" : "text"}" ${f.required ? "required" : ""}></div>`);
  }
  if (required.has("notes") || cfg.optional_fields.includes("notes")) add("notes", "Observações", "text", required.has("notes"),
      `<textarea id="f-notes" data-key="notes" rows="2"></textarea>`);
  if (required.has("consent_lgpd")) rows.push(`<div class="field"><label><input id="f-consent" type="checkbox" style="width:auto"> Aceito o uso dos meus dados para este agendamento *</label></div>`);
  $("fields").innerHTML = rows.join("");
}

$("form").addEventListener("submit", async (event) => {
  event.preventDefault();
  $("error").hidden = true;
  const value = (key) => (document.querySelector(`[data-key="${key}"]`) || {}).value || "";
  const custom = {};
  document.querySelectorAll("[data-custom]").forEach(el => { if (el.value !== "") custom[el.dataset.custom] = el.type === "number" ? Number(el.value) : el.value; });
  const body = {
    service_id: state.service.id,
    start_at: state.slot.start,
    resource_id: state.resource || (state.slot.resource_ids.length === 1 ? state.slot.resource_ids[0] : null),
    customer: { name: value("name"), phone: value("phone"), email: value("email") || null },
    custom, notes: value("notes") || null,
    consent_lgpd: !!($("f-consent") && $("f-consent").checked),
    website: $("website").value,
  };
  $("submit").disabled = true;
  try {
    const booking = await api("/v1/bookings", { method: "POST", body: JSON.stringify(body),
      headers: { "Idempotency-Key": crypto.randomUUID() } });
    showDone(booking);
  } catch (e) {
    $("error").textContent = e.message; $("error").hidden = false;
    $("submit").disabled = false;
  }
});

function showDone(b) {
  document.querySelectorAll("main > section:not(#s-done)").forEach(s => s.hidden = true);
  const when = new Date(b.start).toLocaleString("pt-BR", { dateStyle:"full", timeStyle:"short" });
  const pending = b.status === "pendente";
  $("s-done").innerHTML = `<h2>${pending ? "Pedido recebido" : "Agendamento confirmado"}</h2>
    <dl><dt>Serviço</dt><dd>${b.service_name}</dd><dt>Profissional</dt><dd>${b.resource_name}</dd>
    <dt>Quando</dt><dd>${when}</dd><dt>Nome</dt><dd>${b.customer_name}</dd>
    ${b.price_cents != null ? `<dt>Valor</dt><dd>${brl(b.price_cents)}</dd>` : ""}</dl>
    ${pending ? `<p class="sub">Aguardando a confirmação do estabelecimento.</p>` : ""}
    <button class="link" id="cancel">Cancelar este agendamento</button><div id="cancel-msg" class="msg" hidden></div>`;
  $("s-done").hidden = false;
  $("cancel").onclick = async () => {
    try {
      await api(`/v1/bookings/${b.token}/cancel`, { method: "POST", body: "{}" });
      $("s-done").innerHTML = `<h2 style="color:var(--err)">Agendamento cancelado</h2>`;
    } catch (e) { $("cancel-msg").textContent = e.message; $("cancel-msg").className = "msg err"; $("cancel-msg").hidden = false; }
  };
}

init().catch(e => { $("subtitle").textContent = "Não foi possível carregar: " + e.message; });
</script>
</body>
</html>
